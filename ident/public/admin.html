<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>4EVER1</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0d1320">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="4EVER1">
<style>
  :root{--bg:#0d1320;--panel:#161d2c;--panel2:#1c2438;--line:#2b3651;--line2:#3a4a6b;--ink:#e9eefb;--dim:#9aabc6;--accent:#5b8cff;--accent2:#3b6ef0;--warm:#e8975d;--warm-soft:#2a2016;--good:#3ec77b;--bad:#ff6b66;--warn:#e0a83a;--shadow:0 26px 64px -26px rgba(0,0,0,.7),0 4px 16px rgba(0,0,0,.45)}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{color:var(--ink);min-height:100%;display:flex;flex-direction:column;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1100px 580px at 82% -12%,#3a2a1566,transparent 60%),radial-gradient(900px 540px at -6% 108%,#16265066,transparent 55%),var(--bg)}
  button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:linear-gradient(180deg,#232e46,#1a2336);color:var(--ink);padding:.58rem 1rem;border-radius:12px;font-size:.88rem;font-weight:600;letter-spacing:.01em;transition:transform .14s cubic-bezier(.2,.7,.3,1),border-color .14s,filter .14s,box-shadow .14s;box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 2px 6px rgba(0,0,0,.35)}
  button:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px);box-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 12px 24px -12px rgba(0,0,0,.65)}
  button:active:not(:disabled){transform:translateY(0);filter:brightness(.95)}button:disabled{opacity:.45;cursor:default;box-shadow:none}
  button:focus-visible{outline:none;box-shadow:0 0 0 3px #5b8cff55}
  button.primary{background:linear-gradient(180deg,#6a97ff,#3b6ef0 52%,#2a55c8);border-color:#2a55c8;color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.30) inset,0 14px 28px -12px rgba(59,110,240,.75)}
  button.primary:hover:not(:disabled){filter:brightness(1.06)}
  button.danger{background:linear-gradient(180deg,#4c2828,#3a1e1e);border-color:#6e3b39;color:#ff9b97}
  button.danger:hover:not(:disabled){filter:brightness(1.12);border-color:#8a4744}
  input{font-family:inherit;font-size:.95rem;padding:.6rem .8rem;border-radius:10px;border:1px solid var(--line);background:#0f1728;color:var(--ink);width:100%}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #3b6ef033}
  header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem 1.1rem;border-bottom:1px solid var(--line);background:#0f1626d9;position:sticky;top:0;z-index:5}
  .brand{display:flex;align-items:center;gap:.65rem}
  .logo{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#6f9bff,#3b6ef0);color:#fff;box-shadow:0 6px 16px -6px #3b6ef0cc}
  header h1{font-size:1rem;margin:0}header h1 small{display:block;font-size:.64rem;color:var(--dim);letter-spacing:.18em;text-transform:uppercase}
  .whoami{font-size:.82rem;color:var(--dim);display:flex;gap:.7rem;align-items:center}
  .login{flex:1;display:flex;align-items:center;justify-content:center;padding:1.5rem}
  .card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:2.1rem 1.9rem;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#5b8cff,#6f7bef 48%,var(--warm))}
  .card h2{margin:.2rem 0 1rem;font-size:1.3rem}
  .field{margin-bottom:.9rem}.field label{display:block;font-size:.72rem;color:var(--dim);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.09em}
  .err{color:var(--bad);font-size:.85rem;margin-top:.7rem;min-height:1.1em}
  /* Drei Spalten wie im Team-Bereich: Kantenmenü links, Arbeitsfläche in der
     Mitte, mitdenkende Spalte rechts. Damit sieht die Verwaltung nicht mehr
     aus wie ein fremdes Programm. */
  .dash{flex:1;display:none;min-height:0}
  .dash.on{display:grid;grid-template-columns:236px minmax(0,1fr) 320px;gap:1rem;padding:1rem 1.2rem;align-items:start;overflow:auto}
  .deck-nav,.deck-side{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:.9rem}
  .nav{display:flex;flex-direction:column;gap:.4rem;position:sticky;top:1rem}
  .deck-me{display:flex;align-items:center;gap:.6rem;padding:.1rem .1rem .7rem;border-bottom:1px solid var(--line);margin-bottom:.1rem}
  .deck-avatar{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;font-weight:700;
    background:linear-gradient(135deg,#6f9bff,#3b6ef0);color:#fff;box-shadow:0 6px 16px -6px #3b6ef0cc}
  .deck-me b{font-size:.95rem;display:block;line-height:1.2}
  .deck-me .muted{font-size:.74rem;color:var(--dim)}
  .nav-gruppe{font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
    padding:.7rem .3rem .15rem;border-top:1px solid var(--line);margin-top:.3rem}
  .deck-me + .nav-gruppe{margin-top:0;padding-top:.5rem;border-top:0}
  .deck-item{width:100%;text-align:left;font-size:.9rem;display:block;padding:.6rem .8rem}
  .nav .deck-item{background:transparent;border:1px solid transparent;color:var(--dim);box-shadow:none;border-radius:10px}
  .nav .deck-item:hover{color:var(--ink);background:#212b42;transform:none;box-shadow:none;border-color:transparent}
  .nav .deck-item.sel{color:#fff;background:linear-gradient(180deg,#4a7bf5,#2a55c8);border-color:#2a55c8}
  .deck-spacer{flex:1;min-height:.6rem}
  .content{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:1.1rem 1.2rem}
  .content h2{margin:.1rem 0 1rem;font-size:1.3rem}
  .deck-head{display:flex;align-items:baseline;justify-content:space-between;gap:.7rem;margin-bottom:.9rem;flex-wrap:wrap}
  .deck-head h2{margin:0;font-size:1.15rem}
  .deck-head .muted{font-size:.8rem;color:var(--dim)}
  .uh{font-size:1rem;margin:.2rem 0 .3rem}
  .sub{color:var(--dim);font-size:.85rem;margin:.1rem 0 1rem;line-height:1.5}
  .section{display:none}.section.on{display:block}
  hr{border:0;border-top:1px solid var(--line);margin:1.5rem 0}
  textarea.gross{width:100%;min-height:220px;font-family:inherit;font-size:.95rem;line-height:1.6;padding:.8rem;
    border-radius:12px;border:1px solid var(--line);background:#0f1728;color:var(--ink)}
  textarea.gross:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #3b6ef033}
  .speicherzeile{margin-top:.7rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
  /* Kacheln statt Zahlenreihe: anklickbar, sie führen in ihren Bereich. */
  .kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.8rem}
  .kachel{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:.9rem 1rem;
    text-align:left;display:flex;flex-direction:column;gap:.15rem;box-shadow:none}
  .kachel:hover:not(:disabled){border-color:var(--accent);transform:translateY(-3px)}
  .kachel .ki{font-size:1.35rem;line-height:1}
  .kachel .kz{font-size:1.8rem;font-weight:700;line-height:1.1;margin-top:.2rem}
  .kachel .kt{font-size:.9rem;font-weight:650}
  .kachel .ku{font-size:.74rem;color:var(--dim);line-height:1.4}
  .kachel.ruft{border-color:var(--warm);background:linear-gradient(180deg,#2a2016,#1c2438)}
  .kachel.ruft .kz{color:var(--warm)}
  .kachel.still{cursor:default}
  .kachel.still:hover{border-color:var(--line);transform:none}
  /* Rechte Kante */
  .deck-side{display:flex;flex-direction:column;gap:1rem;position:sticky;top:1rem}
  .deck-side.leer{display:none}
  .seiten-block{display:none}
  .seiten-block.an{display:block}
  .seiten-block .deck-head{margin-bottom:.5rem;align-items:center}
  .seiten-block .deck-head h2{font-size:.98rem}
  .block-zu{border:0;background:transparent;color:var(--dim);padding:.1rem .35rem;font-size:.95rem;
    line-height:1;box-shadow:none;border-radius:8px}
  .block-zu:hover:not(:disabled){background:#22304d;color:var(--ink);transform:none;box-shadow:none}
  .hlp{font-size:.84rem;color:var(--dim);line-height:1.6;margin:.2rem 0 .7rem}
  .hlp b{color:var(--ink);font-weight:600}
  .hlp code{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:.05rem .35rem;font-size:.94em}
  .hlp-akt{display:flex;flex-direction:column;gap:.45rem}
  .row{display:flex;justify-content:space-between;align-items:center;gap:.6rem;border:1px solid var(--line);border-radius:12px;padding:.7rem .85rem;margin-bottom:.5rem;background:var(--panel2);font-size:.9rem}
  .row .acts{display:flex;gap:.4rem;flex-wrap:wrap}.muted{color:var(--dim);font-size:.78rem}
  .pill{font-size:.72rem;padding:.15rem .5rem;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
  .pill.ok{color:#5fe0a0;border-color:#2f6b4a;background:#163024}.pill.no{color:#ff9b97;border-color:#6b3230;background:#331b1b}.pill.warn{color:#e0b45a;border-color:#584720;background:#2c2411}
  .addbar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:.7rem}
  .addbar input{flex:1;min-width:140px}.note{font-size:.82rem;color:var(--dim);margin-top:.5rem;line-height:1.5}
  .note code{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:.05rem .35rem}
  .acc{border:1px solid var(--line);border-radius:14px;padding:1rem;background:var(--panel2);margin-bottom:.7rem}
  .acc .top{display:flex;justify-content:space-between;gap:.6rem;align-items:flex-start}.acc .nm{font-size:1rem;font-weight:650}.acc .meta{font-size:.78rem;color:var(--dim);margin-top:.25rem;line-height:1.5}
  .thumbs{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.7rem}.thumbs figure{margin:0;display:flex;flex-direction:column;gap:.25rem;align-items:center;width:104px}
  .thumbs img{height:90px;width:104px;object-fit:cover;border:1px solid var(--line);border-radius:8px;cursor:zoom-in}.thumbs figcaption{font-size:.62rem;color:var(--dim);text-align:center}
  .evlog{font-size:.8rem;font-family:ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .evrow{display:grid;grid-template-columns:11rem 8rem 1fr;gap:.5rem;padding:.4rem .7rem;border-bottom:1px solid var(--line)}.evrow:last-child{border-bottom:0}.evrow .t{color:var(--dim)}
  .empty{color:var(--dim);font-size:.9rem;padding:1rem 0}
  /* Wortlaut in der Akte: so gesetzt, wie er vorgelesen wurde. */
  .wortlaut{white-space:pre-wrap;font-size:.85rem;line-height:1.65;color:var(--ink);background:#0f1728;
    border:1px solid var(--line);border-radius:10px;padding:.7rem .85rem;margin-top:.45rem;max-height:20rem;overflow:auto}
  .hakenliste{margin:.45rem 0 0;padding-left:1.1rem;font-size:.83rem;color:var(--dim);line-height:1.6}
  .reclist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}
  .reccard{border:1px solid var(--line);border-radius:14px;background:var(--panel2);overflow:hidden;display:flex;flex-direction:column}
  .recvid{position:relative;background:#000;aspect-ratio:16/10}
  .recvid video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
  .recdur{position:absolute;right:.5rem;bottom:.5rem;background:#000a;color:#fff;font-size:.72rem;padding:.1rem .4rem;border-radius:6px;pointer-events:none}
  .recbody{padding:.7rem .85rem}.rectop{display:flex;justify-content:space-between;gap:.5rem;align-items:flex-start}.rectop .nm{font-weight:650;font-size:1rem}
  .recacts{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;padding:.7rem .85rem;border-top:1px solid var(--line)}
  .reclink{color:var(--accent);font-size:.85rem;text-decoration:underline;align-self:center}
  .toast{position:fixed;left:50%;bottom:1.3rem;transform:translateX(-50%) translateY(8px);background:#141c2ef2;color:var(--ink);border:1px solid var(--line2);padding:.65rem 1.1rem;border-radius:12px;font-size:.85rem;opacity:0;transition:.22s;pointer-events:none;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* Schmal: eine Spalte. Das Kantenmenü wird zur Zeile, die rechte Spalte
     rutscht unter die Arbeitsfläche – sie bleibt lesbar, statt zu verschwinden. */
  @media(max-width:1080px){
    .dash.on{grid-template-columns:1fr;gap:.8rem;padding:.8rem}
    .nav,.deck-side{position:static}
    .nav{flex-direction:row;flex-wrap:wrap;align-items:center}
    .nav .deck-item{width:auto;flex:1;min-width:140px;text-align:center}
    .deck-me{border-bottom:0;padding:0;margin:0;width:100%}
    .nav-gruppe{width:100%;border-top:0;padding:.4rem .3rem .1rem;margin-top:0}
    .deck-spacer{display:none}
  }
  @media(max-width:520px){.kacheln{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true"><path d="M12 2.6l6.8 2.5v5.2c0 4.3-2.9 7.4-6.8 8.8-3.9-1.4-6.8-4.5-6.8-8.8V5.1L12 2.6z" fill="#fff"/><path d="M8.6 12.1l2.2 2.2 4.6-4.8" stroke="#2a55c8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><h1>4EVER1 <small>Intern</small></h1></div>
  <div class="whoami" id="whoami"></div>
</header>

<div class="login" id="login">
  <div class="card">
    <h2>Anmeldung</h2>
    <div class="field"><label>Passwort</label><input id="pw" type="password" autocomplete="current-password"></div>
    <!-- 2FA ist optional: Feld erscheint nur, wenn der Server einen Code verlangt. -->
    <div class="field" id="totpField" style="display:none"><label>2FA-Code</label><input id="totp" inputmode="numeric" placeholder="6-stellig"></div>
    <button id="loginBtn" class="primary" style="width:100%">Anmelden</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div class="dash" id="dash"></div>

<script src="admin.js"></script>
</body>
</html>
