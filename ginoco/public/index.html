<div id="app"><div class="boot"><svg class="g-spin" viewBox="-8 -8 116 116" width="40" height="40" fill="none" aria-hidden="true"><defs><linearGradient id="glgb" x1="6" y1="96" x2="92" y2="8" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#e9530a"/><stop offset=".32" stop-color="#f6890d"/><stop offset=".62" stop-color="#ffc21a"/><stop offset="1" stop-color="#f7c40f"/></linearGradient></defs><path d="M87.6 36.3 A40 40 0 1 1 64.98 12.9" stroke="url(#glgb)" stroke-width="14" stroke-linecap="round"/><circle cx="50" cy="50" r="10" stroke="url(#glgb)" stroke-width="10"/><g stroke="url(#glgb)" stroke-width="13" stroke-linecap="round"><line x1="35" y1="50" x2="17" y2="50"/><line x1="65" y1="50" x2="83" y2="50"/><line x1="50" y1="65" x2="50" y2="83"/></g></svg><span>Lädt…</span></div></div>
<div id="toast" class="toast" hidden></div>
<script>
  // „G"-Ladebildschirm: erst zeichnet sich das Logo (zum G), dann blendet es weg
  // und gibt die App frei. Läuft mind. ~1,4 s, damit die Animation sichtbar ist.
  (function(){
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var wait = reduce ? 350 : 1500;
    window.addEventListener('load', function(){
      setTimeout(function(){
        var s = document.getElementById('splash');
        if (!s) return;
        s.classList.add('gone');
        setTimeout(function(){ if (s && s.parentNode) s.parentNode.removeChild(s); }, 550);
      }, wait);
    });
  })();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});

</script>
